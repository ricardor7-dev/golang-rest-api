apiVersion: apps/v1
kind: Deployment
metadata:
  name: teste-audiobooks
  #namespace: cxai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teste-audiobooks
  template:
    metadata:
     # annotations:
     #   linkerd.io/inject: enabled
      labels:
        app: audiobooks
        name: audiobooks
    spec:
      containers:
        - name: audiobooks
          image: "ghcr.io/ric7pt/golang-rest-api:IMAGE_TAG"
          env:
          - name: PGHOST
            valueFrom: 
              configMapKeyRef:
                name: global-environment-config
                key: PG_HOST            
          - name: PGPORT
            valueFrom: 
              configMapKeyRef:
                name: global-environment-config
                key: PG_PORT                
          - name: PGDATABASE
            value: testeDB
          - name: PGUSER
            #valueFrom: { secretKeyRef: { name: sa.cxai-postgres.credentials.postgresql.acid.zalan.do, key: username } }
            valueFrom: { secretKeyRef: { name: pg-cluster-secret, key: POSTGRES_DB_USER } }
          - name: PGPASSWORD
            #valueFrom: { secretKeyRef: { name: sa.cxai-postgres.credentials.postgresql.acid.zalan.do, key: password } }
            valueFrom: { secretKeyRef: { name: pg-cluster-secret, key: POSTGRES_DB_PASSWORD } }
          - name: PGSSLMODE
            value: "require"
          - name: HTTP_SERVER_HOST
            value: "0.0.0.0"
          - name: HTTP_SERVER_PORT
            value: "8080"     
      imagePullSecrets:
        - name: regcred
                
#-----please adjust the bellow information----------
---
kind: ConfigMap 
apiVersion: v1 
metadata:
  name: go-rest-api
data:
  #LOGGING
  LOG_LEVEL: "info"
  LOG_ERROR_STACK: "true"
 # LOG_GRAYLOG_HOST: "127.0.0.1"
 # LOG_GRAYLOG_PORT: "12201"

  #Server
  HTTP_SERVER_HOST: "0.0.0.0"
  HTTP_SERVER_PORT: "8080"

apiVersion: v1
kind: Service
metadata:
  name: api-audiobooks
spec:
  selector:
    app: api-audiobooks
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080